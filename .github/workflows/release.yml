name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Windows cannot be cross-compiled from the Linux runner — flutter build
  # windows needs MSVC — so it builds on its own runner and hands the archive
  # to the release job as an artifact.
  build-windows:
    runs-on: windows-latest
    outputs:
      # Consumed by the release job's Flutter setup, so one workflow cannot
      # build its platforms on two different framework versions.
      flutter-version: ${{ steps.flutter.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version bump below derives the build number from the commit
          # count, and a shallow clone counts 1 — which would stamp this
          # platform +1 while the others carry the real count.
          fetch-depth: 0

      # Same validation as the release job, and not negotiable here either: the
      # tag flows into file names and shell, and a Windows runner is no more
      # entitled to trust a ref than a Linux one.
      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          FULL_TAG=${GITHUB_REF#refs/tags/}
          if ! printf '%s' "$FULL_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to build: tag '$FULL_TAG' is not a plain vX.Y.Z tag."
            exit 1
          fi
          echo "full_tag=$FULL_TAG" >> $GITHUB_OUTPUT
          echo "tag=${FULL_TAG#v}" >> $GITHUB_OUTPUT

      # The same bump the release job applies before its own builds. Without
      # it this platform builds from the tag's committed pubspec — which still
      # holds the *previous* release's version — and choke.exe would report the
      # release before the one it shipped in, on the Account screen, forever.
      - name: Update version in pubspec.yaml
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          BUILD=$(git rev-list --count HEAD)
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      # Cargokit compiles the Nostr crate during flutter build windows; the
      # channel comes from rust-toolchain.toml and the host target
      # (x86_64-pc-windows-msvc) is implicit. MSVC itself ships on the runner.
      - name: Setup Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # Downloads only — never rust/target, and no restore-keys fallback.
          # This job publishes signed binaries, and a prefix fallback accepts a
          # cache written by any less-privileged workflow: a poisoned target/
          # would compile straight into the release. Registry and git are
          # content-addressed downloads keyed to the exact lockfile.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Recorded so the release job can install the same version. Two
      # independent "stable" resolutions can disagree when a Flutter release
      # lands between them, and one app release must not ship two frameworks.
      #
      # The bare `flutter --version` first is load-bearing. The first flutter
      # invocation on a fresh runner bootstraps the tool (Dart SDK download,
      # pub upgrade), spraying non-JSON progress output. Piped into jq, that
      # noise makes jq bail and close the pipe — and on Windows the tool then
      # dies writing to the closed pipe (errno 232), and its retry loop hangs
      # the job forever. Bootstrap with nobody reading the pipe, so the
      # --machine call below emits clean JSON.
      - name: Report Flutter version
        id: flutter
        shell: bash
        run: |
          flutter --version
          echo "version=$(flutter --version --machine | jq -r .frameworkVersion)" \
            >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows bundle
        shell: bash
        env:
          FULL_TAG: ${{ steps.version.outputs.full_tag }}
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      # Wrapped in a versioned top-level directory for the same reason the
      # Linux tarball is: extraction yields one folder, not a spray of DLLs
      # into whatever directory the user happened to be in.
      - name: Package Windows bundle
        shell: pwsh
        env:
          FULL_TAG: ${{ steps.version.outputs.full_tag }}
        run: |
          $dir = "choke-$env:FULL_TAG-windows-x64"
          Move-Item build/windows/x64/runner/Release $dir
          # The build links the MSVC runtime dynamically and CMake installs
          # nothing of it, so on a clean machine choke.exe dies on a missing
          # msvcp140.dll — while the release notes promise extract-and-run.
          # Flutter's own zip guidance is to ship these three app-locally.
          $dlls = 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll' |
            ForEach-Object { Join-Path $env:SystemRoot 'System32' $_ }
          foreach ($dll in $dlls) {
            if (-not (Test-Path $dll)) { throw "missing runtime DLL: $dll" }
          }
          Copy-Item $dlls -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: choke-${{ steps.version.outputs.full_tag }}-windows-x64.zip
          if-no-files-found: error
          # Long enough for a failed release to be re-run after a weekend; a
          # 1-day window turns a Monday retry into a missing-artifact failure.
          retention-days: 7

  build-and-release:
    # The release attaches the Windows archive, so it has to exist first. This
    # also makes the release all-or-nothing: a broken Windows build fails the
    # whole release rather than quietly shipping one without it.
    needs: build-windows
    runs-on: ubuntu-latest
    # Exposes "is the Play service-account secret configured?" to step-level
    # `if:`, since the secrets context can't be read directly there. Lets the
    # Play upload skip cleanly (e.g. on forks) instead of failing the release.
    env:
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Extract version from tag
        id: version
        run: |
          FULL_TAG=${GITHUB_REF#refs/tags/}
          # Refuse anything that isn't a plain vX.Y.Z tag. Tag refs can legally
          # contain shell metacharacters, and this value flows into later `run:`
          # steps — validating it here neutralizes template injection at the
          # source. Pre-release/build suffixes are rejected on purpose: the
          # version-bump step appends its own +<build>, so a suffixed tag (e.g.
          # v1.2.3+ci) would produce a malformed pubspec version.
          if ! printf '%s' "$FULL_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to release: tag '$FULL_TAG' is not a plain vX.Y.Z tag."
            exit 1
          fi
          echo "tag=${FULL_TAG#v}" >> $GITHUB_OUTPUT
          echo "full_tag=$FULL_TAG" >> $GITHUB_OUTPUT

          # Get the previous tag for changelog range
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "prev_tag=" >> $GITHUB_OUTPUT
            echo "is_first=true" >> $GITHUB_OUTPUT
          else
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "is_first=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        # Pass tag-derived values through env, never interpolated into shell
        # source (template-injection hardening).
        env:
          TAG: ${{ steps.version.outputs.full_tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          IS_FIRST: ${{ steps.version.outputs.is_first }}
        run: |
          if [ "$IS_FIRST" = "true" ]; then
            # First release — all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREV_TAG}..${TAG}")
          fi

          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|add|new)" || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bug|patch|hotfix)" || true)
          DOCS=$(echo "$COMMITS" | grep -iE "^- (doc|docs|readme)" || true)
          OTHER=$(echo "$COMMITS" | grep -ivE "^- (feat|add|new|fix|bug|patch|hotfix|doc|docs|readme)" || true)

          # Build markdown changelog
          {
            echo "## What's New in $TAG"
            echo ""

            if [ -n "$FEATURES" ]; then
              echo "### ✨ New Features"
              echo "$FEATURES"
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            if [ -n "$DOCS" ]; then
              echo "### 📚 Documentation"
              echo "$DOCS"
              echo ""
            fi

            if [ -n "$OTHER" ]; then
              echo "### 🔧 Other Changes"
              echo "$OTHER"
              echo ""
            fi

            if [ "$IS_FIRST" != "true" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

          # Also write to CHANGELOG.md (prepend to existing)
          DATESTAMP=$(date -u +"%Y-%m-%d")
          {
            echo "# Changelog"
            echo ""
            echo "## [$TAG] - $DATESTAMP"
            echo ""

            if [ -n "$FEATURES" ]; then
              echo "### Added"
              echo "$FEATURES"
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "### Fixed"
              echo "$FIXES"
              echo ""
            fi

            if [ -n "$DOCS" ]; then
              echo "### Documentation"
              echo "$DOCS"
              echo ""
            fi

            if [ -n "$OTHER" ]; then
              echo "### Changed"
              echo "$OTHER"
              echo ""
            fi

            # Append previous changelog content (skip the first "# Changelog" header)
            if [ -f CHANGELOG.md ]; then
              tail -n +2 CHANGELOG.md
            fi
          } > CHANGELOG_NEW.md

          mv CHANGELOG_NEW.md CHANGELOG.md

      - name: Update version in pubspec.yaml
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          # Extract build number: count total commits
          BUILD=$(git rev-list --count HEAD)
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD}/" pubspec.yaml
          echo "Updated pubspec.yaml to version: ${VERSION}+${BUILD}"
          grep "^version:" pubspec.yaml

      - name: Commit changelog and version bump
        env:
          FULL_TAG: ${{ steps.version.outputs.full_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --ff-only "$FULL_TAG" || true
          git add CHANGELOG.md pubspec.yaml
          git commit -m "chore: update changelog and version for $FULL_TAG"
          git push origin main

      # The step above leaves HEAD on a branch that can move — anyone merging
      # while Windows spent its 15-20 minutes building would split the release
      # across source commits: a zip from the tag, an APK from whatever main
      # had become. Every platform builds from the immutable tagged commit,
      # re-stamped with the same version the bump computed there.
      - name: Build from the immutable tag
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          git checkout --detach "$GITHUB_SHA"
          BUILD=$(git rev-list --count HEAD)
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      # The App Bundle packs native code for every ABI, so Cargokit
      # cross-compiles the Rust crate three times (arm, arm64, x86_64). Together
      # with the APK build, the NDK, and the Gradle/cargo caches this exhausts
      # the ~14 GB free on the runner ("No space left on device"). Reclaim space
      # from preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The APK now contains a Rust library (Nostr cryptography), which
      # Cargokit cross-compiles during `flutter build apk`. Without a Rust
      # toolchain the release build fails. The version and the Android
      # targets come from rust-toolchain.toml.
      - name: Setup Rust
        run: rustup show

      # Puts sdkmanager on PATH; the runner ships the SDK but not its CLI.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Cargokit compiles the crate through the NDK, so the version the project
      # pins must actually be installed — otherwise configuring the
      # :rust_lib_choke project dies with a bare NullPointerException. Read it
      # from build.gradle.kts so this can never drift out of sync with it.
      - name: Install Android NDK
        run: |
          NDK=$(grep -oP 'ndkVersion = "\K[^"]+' android/app/build.gradle.kts)
          echo "Installing NDK $NDK"
          sdkmanager --install "ndk;$NDK"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # Downloads only — never rust/target, and no restore-keys fallback.
          # This job publishes signed binaries, and a prefix fallback accepts a
          # cache written by any less-privileged workflow: a poisoned target/
          # would compile straight into the release. Registry and git are
          # content-addressed downloads keyed to the exact lockfile.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Whatever stable resolved to when the Windows job set up, minutes
          # ago — not whatever it resolves to now.
          flutter-version: ${{ needs.build-windows.outputs.flutter-version }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify signing secrets
        run: |
          missing=""
          [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "${{ secrets.KEY_PASSWORD }}" ] && missing="$missing KEY_PASSWORD"
          [ -z "${{ secrets.KEY_ALIAS }}" ] && missing="$missing KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing"
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/choke-upload-key.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=choke-upload-key.jks" >> android/key.properties

      # arm64 only. A plain `flutter build apk` packs native code for three ABIs
      # into one file — and since the Nostr stack became a Rust library, that is
      # three copies of it. Every 64-bit Android phone made in the last decade
      # runs arm64-v8a; armeabi-v7a and x86_64 were costing ~40 MB to serve
      # 32-bit hardware nobody referees on, and emulators.
      #
      # Deliberately NOT --split-per-abi: that renames the output to
      # app-arm64-v8a-release.apk and would break the step below.
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        env:
          FULL_TAG: ${{ steps.version.outputs.full_tag }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "choke-${FULL_TAG}.apk"

      # The Android App Bundle for Google Play. Unlike the sideload APK above,
      # this deliberately keeps ALL ABIs (the default): Play generates optimized
      # per-device APKs from the bundle, so every user still downloads only their
      # own architecture — including all ABIs here costs nothing at install time
      # and is what lets Play serve arm64, armeabi-v7a, and x86_64 devices.
      # It is signed with the same upload key as the APK via android/key.properties.
      - name: Build App Bundle (AAB for Google Play)
        run: flutter build appbundle --release

      - name: Rename AAB
        env:
          FULL_TAG: ${{ steps.version.outputs.full_tag }}
        run: cp build/app/outputs/bundle/release/app-release.aab "choke-${FULL_TAG}.aab"

      # Linux desktop build. Choke ships the linux/ runner, so Flutter can
      # produce a native x64 bundle. Needs the GTK + build toolchain, plus
      # libsecret for flutter_secure_storage's Linux backend and GStreamer for
      # audioplayers' (the match start bell and end horn). The Rust crate is
      # cross-compiled for the host target by Cargokit during the build.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          # The Rust crate rides Flutter's native-assets path, which needs a
          # COMPLETE Clang toolchain (README "Building for Linux desktop"):
          # a linker sitting beside clang, and the libstdc++ headers matching
          # the GCC installation Clang selects — the runtime can be present
          # with the headers missing, and then every C++ compile fails.
          sudo apt-get install -y lld
          GCC_VER=$(clang++ -v 2>&1 | grep -oP 'Selected GCC installation:.*/\K[0-9]+' || true)
          sudo apt-get install -y "libstdc++-${GCC_VER:-14}-dev"

      # Fail here, with a readable error, rather than minutes later inside
      # flutter build linux. Mirrors the README's own verification commands.
      - name: Preflight the Clang toolchain
        run: |
          CLANG_DIR=$(dirname "$(readlink -f "$(which clang++)")")
          ls "$CLANG_DIR"/clang "$CLANG_DIR"/llvm-ar "$CLANG_DIR"/ld.lld
          printf '#include <type_traits>\nint main() { return 0; }\n' > /tmp/probe.cc
          clang++ -c /tmp/probe.cc -o /tmp/probe.o
          echo "Toolchain preflight OK"

      - name: Build Linux bundle
        env:
          FULL_TAG: ${{ steps.version.outputs.full_tag }}
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release
          # Wrap the bundle in a versioned top-level directory so extraction
          # yields one folder instead of spraying files into the user's cwd.
          mv build/linux/x64/release/bundle "choke-${FULL_TAG}-linux-x64"
          tar -czf "choke-${FULL_TAG}-linux-x64.tar.gz" \
            "choke-${FULL_TAG}-linux-x64"

      - name: Generate release description
        id: description
        env:
          TAG: ${{ steps.version.outputs.full_tag }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          # Read the categorized changes
          FEATURES=$(cat RELEASE_NOTES.md | sed -n '/### ✨/,/^###\|^$/p' | grep "^-" || true)
          FIXES=$(cat RELEASE_NOTES.md | sed -n '/### 🐛/,/^###\|^$/p' | grep "^-" || true)

          {
            echo "# 🥋 Choke ${TAG}"
            echo ""
            echo "A new version of Choke is here!"
            echo ""

            if [ -n "$FEATURES" ]; then
              FEATURE_COUNT=$(echo "$FEATURES" | wc -l)
              echo "This release brings **${FEATURE_COUNT} new feature(s)** to make your BJJ scoring experience even better:"
              echo ""
              echo "$FEATURES"
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              FIX_COUNT=$(echo "$FIXES" | wc -l)
              echo "We also squashed **${FIX_COUNT} bug(s)** 🐛:"
              echo ""
              echo "$FIXES"
              echo ""
            fi

            echo "---"
            echo ""
            echo "### 📥 Install"
            echo "**Android:** download \`choke-${TAG}.apk\` below and install it on your device."
            echo ""
            echo "**Linux (x64):** download \`choke-${TAG}-linux-x64.tar.gz\`, extract, and run:"
            echo '```bash'
            echo "tar -xzf choke-${TAG}-linux-x64.tar.gz"
            echo "./choke-${TAG}-linux-x64/choke"
            echo '```'
            echo "Requires \`libgtk-3\` and \`libsecret-1\` at runtime (preinstalled on most desktops)."
            echo ""
            echo "**Windows (x64):** download \`choke-${TAG}-windows-x64.zip\`, extract, and run \`choke.exe\` inside the folder."
            echo ""
            echo "### 📋 Full Changelog"
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the complete history."
          } > RELEASE_BODY.md

          cat RELEASE_BODY.md

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            choke-${{ steps.version.outputs.full_tag }}.apk
            choke-${{ steps.version.outputs.full_tag }}.aab
            choke-${{ steps.version.outputs.full_tag }}-linux-x64.tar.gz
            choke-${{ steps.version.outputs.full_tag }}-windows-x64.zip
          generate_release_notes: false
          draft: false
          prerelease: false

      # Publish the signed bundle to Google Play's internal testing track.
      # Skipped when PLAY_SERVICE_ACCOUNT_JSON is not set, so the GitHub release
      # still succeeds. Requirements before the first automated upload works:
      #   1. Create the app in the Play Console and upload one build manually
      #      (Play won't accept API uploads until the listing exists).
      #   2. Create a Google Cloud service account, grant it access in the Play
      #      Console (Users & permissions), and store its JSON key as the
      #      PLAY_SERVICE_ACCOUNT_JSON repo secret.
      # Change `track` to `production` (or alpha/beta) once you're ready to ship
      # to users; `internal` is the safe default for automated releases.
      - name: Publish to Google Play (internal track)
        if: env.HAS_PLAY_SA == 'true'
        # Pinned to a full commit SHA (supply-chain hardening for a third-party
        # action); the trailing comment tracks the human-readable version.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.protolayer.choke
          releaseFiles: choke-${{ steps.version.outputs.full_tag }}.aab
          track: internal
          status: completed
